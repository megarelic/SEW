<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Web App Manifest (Forces Landscape Mode when launched from Home Screen) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"SEW","short_name":"SEW","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","orientation":"landscape"}' />
  
  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SEW" />
  <meta name="theme-color" content="#0f172a" />
  
  <title>SEW - Subterranean Extraction Warfare</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
      margin: 0 auto;
    }

    /* Rotate Phone Warning Screen (Only appears when held in Portrait mode) */
    #rotate-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #0f172a;
      color: #38bdf8;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      font-size: 18px;
      font-weight: bold;
    }
    #rotate-screen span { font-size: 48px; margin-bottom: 12px; }

    @media (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    /* Top Status Bar (Adjusted for Landscape viewports) */
    #hud {
      position: absolute;
      top: 12px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }

    /* Dialogue Box */
    #dialogue-box {
      position: absolute;
      top: 48px;
      left: 20%;
      right: 20%;
      z-index: 10;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #e2e8f0;
      pointer-events: none;
      text-align: center;
    }

    /* Landscape Controls Layout */
    #controls {
      position: absolute;
      bottom: 16px;
      left: 20px;
      right: 20px;
      height: 100px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    /* D-PAD (Bottom Left) */
    .dpad {
      position: relative;
      width: 100px;
      height: 100px;
      pointer-events: auto;
    }
    .dpad-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: #fff;
      backdrop-filter: blur(4px);
    }
    .dpad-btn:active { background: rgba(56, 189, 248, 0.6); }
    #btn-up { top: 0; left: 34px; }
    #btn-down { bottom: 0; left: 34px; }
    #btn-left { top: 34px; left: 0; }
    #btn-right { top: 34px; right: 0; }

    /* Action Button "A" (Bottom Right) */
    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.4);
      border: 3px solid rgba(34, 197, 94, 0.8);
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }
    .action-btn:active { background: rgba(34, 197, 94, 0.8); transform: scale(0.95); }
  </style>
</head>
<body>

  <!-- Orientation Warning Overlay -->
  <div id="rotate-screen">
    <span>🔄</span>
    Please rotate your phone to Landscape mode to play SEW!
  </div>

  <div id="hud">
    <div class="hud-box" id="stash-info">Gold: 🪙 0 | Seeds: 🌰 3</div>
    <div class="hud-box" id="gear-info">Gear: [None]</div>
  </div>

  <div id="dialogue-box">Walk up to the tilled soil patch and press [A] to plant!</div>

  <div id="controls">
    <div class="dpad">
      <div class="dpad-btn" id="btn-up">▲</div>
      <div class="dpad-btn" id="btn-down">▼</div>
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-right">▶</div>
    </div>
    <div class="action-btn" id="btn-action">A</div>
  </div>

  <script>
    // --- 1. STORAGE ---
    const DEFAULT_DATA = { gold: 25, seeds: 3, inventory: [] };

    function getPlayerData() {
      const saved = localStorage.getItem('SEW_SAVE_DATA');
      return saved ? JSON.parse(saved) : DEFAULT_DATA;
    }

    function savePlayerData(data) {
      localStorage.setItem('SEW_SAVE_DATA', JSON.stringify(data));
      updateUI();
    }

    let playerData = getPlayerData();

    function updateUI() {
      document.getElementById('stash-info').innerHTML = `Gold: 🪙 ${playerData.gold} | Seeds: 🌰 ${playerData.seeds}`;
      document.getElementById('gear-info').innerHTML = `Gear: [${playerData.inventory.length ? playerData.inventory.join(', ') : 'Empty'}]`;
    }

    // --- 2. GAME ENGINE ---
    let player, cursors, soilPatch, currentSoilState = 'EMPTY';
    let moveDir = { up: false, down: false, left: false, right: false };
    const SPEED = 130;

    const config = {
      type: Phaser.AUTO,
      width: window.innerWidth,
      height: window.innerHeight,
      pixelArt: true,
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
      },
      scene: { create, update }
    };

    const game = new Phaser.Game(config);

    function create() {
      const scene = this;

      // Render Tile Floor Grid
      const tileGfx = scene.make.graphics({ add: false });
      tileGfx.fillStyle(0x1e293b, 1).fillRect(0, 0, 32, 32);
      tileGfx.lineStyle(1, 0x334155, 0.5).strokeRect(0, 0, 32, 32);
      tileGfx.generateTexture('floorTile', 32, 32);

      for (let x = 0; x < window.innerWidth + 64; x += 32) {
        for (let y = 0; y < window.innerHeight + 64; y += 32) {
          scene.add.image(x, y, 'floorTile');
        }
      }

      // Soil Patch Sprite
      const soilGfx = scene.make.graphics({ add: false });
      soilGfx.fillStyle(0x78350f, 1).fillRect(0, 0, 48, 48);
      soilGfx.lineStyle(2, 0x451a03, 1).strokeRect(0, 0, 48, 48);
      soilGfx.generateTexture('soilTex', 48, 48);

      // Hero Sprite
      const playerGfx = scene.make.graphics({ add: false });
      playerGfx.fillStyle(0x38bdf8, 1).fillRect(4, 4, 24, 24);
      playerGfx.fillStyle(0xef4444, 1).fillRect(4, 0, 24, 8);
      playerGfx.fillStyle(0xfbebe8, 1).fillRect(8, 8, 16, 8);
      playerGfx.generateTexture('playerTex', 32, 32);

      soilPatch = scene.physics.add.sprite(window.innerWidth / 2, window.innerHeight / 2 - 20, 'soilTex');
      player = scene.physics.add.sprite(window.innerWidth / 2 - 80, window.innerHeight / 2 - 20, 'playerTex');
      player.setCollideWorldBounds(true);

      cursors = scene.input.keyboard.createCursorKeys();

      bindDPad('btn-up', 'up');
      bindDPad('btn-down', 'down');
      bindDPad('btn-left', 'left');
      bindDPad('btn-right', 'right');

      document.getElementById('btn-action').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInteraction(scene);
      });

      updateUI();
    }

    function bindDPad(btnId, direction) {
      const el = document.getElementById(btnId);
      const startMove = (e) => { e.preventDefault(); moveDir[direction] = true; };
      const stopMove = (e) => { e.preventDefault(); moveDir[direction] = false; };

      el.addEventListener('pointerdown', startMove);
      el.addEventListener('pointerup', stopMove);
      el.addEventListener('pointerleave', stopMove);
    }

    function handleInteraction(scene) {
      const dist = Phaser.Math.Distance.Between(player.x, player.y, soilPatch.x, soilPatch.y);
      const dialogue = document.getElementById('dialogue-box');

      if (dist > 65) {
        dialogue.innerText = "You're too far away from the soil patch!";
        return;
      }

      if (currentSoilState === 'EMPTY') {
        if (playerData.seeds > 0) {
          playerData.seeds -= 1;
          savePlayerData(playerData);

          currentSoilState = 'GROWING';
          soilPatch.setTint(0xeab308);
          dialogue.innerText = "Planted a Sword Seed! Maturing in 3 seconds...";

          scene.time.delayedCall(3000, () => {
            currentSoilState = 'READY';
            soilPatch.setTint(0x22c55e);
            dialogue.innerText = "The Sword Crop has fully grown! Press [A] to harvest!";
          });
        } else {
          dialogue.innerText = "You have no seeds left to plant!";
        }
      } else if (currentSoilState === 'READY') {
        currentSoilState = 'EMPTY';
        soilPatch.clearTint();
        playerData.inventory.push('Iron Sword');
        playerData.gold += 15;
        savePlayerData(playerData);
        dialogue.innerText = "Harvested an Iron Sword! Added 15 Gold to your stash.";
      } else if (currentSoilState === 'GROWING') {
        dialogue.innerText = "Patience! The plant is still growing...";
      }
    }

    function update() {
      player.body.setVelocity(0);

      if (cursors.left.isDown || moveDir.left) player.body.setVelocityX(-SPEED);
      else if (cursors.right.isDown || moveDir.right) player.body.setVelocityX(SPEED);

      if (cursors.up.isDown || moveDir.up) player.body.setVelocityY(-SPEED);
      else if (cursors.down.isDown || moveDir.down) player.body.setVelocityY(SPEED);

      player.body.velocity.normalize().scale(SPEED);
    }
  </script>
</body>
</html>
